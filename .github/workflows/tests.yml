name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The package claims Python 3.9+ and zero dependencies. Both are only claims
    # until something other than the author's laptop runs them.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the suite
        run: python -m unittest discover -s tests -v

      - name: Verify the hooks work from a clone
        # Exactly the two commands the README tells a new user to run.
        run: |
          set -euo pipefail
          CLAIMKEEP_BRIEF_DIR=/tmp/ck-ci ./scripts/precompact.sh <<'EOF'
          {"transcript_path": "examples/sample_transcript.jsonl", "session_id": "ci"}
          EOF
          test -n "$(ls -A /tmp/ck-ci)" || { echo "precompact wrote no brief"; exit 1; }
          CLAIMKEEP_BRIEF_DIR=/tmp/ck-ci CLAUDE_HOOK_EVENT_NAME=PostCompact \
            ./scripts/postcompact.sh <<< '{}' | grep -q additionalContext
          # The recall hook must stay silent on a prompt nothing matches, and
          # must always exit 0 — it runs on every user turn.
          CLAIMKEEP_BRIEF_DIR=/tmp/ck-ci ./scripts/userprompt.sh \
            <<< '{"prompt":"hello there"}' | grep -q . && \
            { echo "recall hook spoke when it had nothing"; exit 1; } || true

      - name: Codex bridge
        # Its end-to-end test skips itself when it cannot locate the package, so
        # assert the count as well — a silent skip here would hide the only test
        # that exercises harvest and render together.
        run: |
          set -euo pipefail
          cd integrations/codex
          out=$(python -m unittest test_codex_adapter 2>&1)
          echo "$out" | tail -3
          # "skipped=" appears only in the summary line; a test *named* ..._skipped
          # must not trip this.
          echo "$out" | grep -q "skipped=" && { echo "e2e test skipped - package not found"; exit 1; }
          echo "$out" | grep -q "^OK$" || { echo "bridge tests failed"; exit 1; }

      - name: Install with pip and run the CLI
        run: |
          set -euo pipefail
          pip install --quiet .
          claimkeep version

      - name: No third-party imports in the package
        # "standard library only" is in the README; check it rather than trust it.
        run: |
          python - <<'PY'
          import ast, importlib.util, pathlib, sysconfig

          # sys.stdlib_module_names is 3.10+, and this package supports 3.9.
          # Resolving each import and looking at where it lives works everywhere.
          site = sysconfig.get_paths()["purelib"]
          bad = []
          for f in pathlib.Path("claimkeep").rglob("*.py"):
              for node in ast.walk(ast.parse(f.read_text(encoding="utf-8"))):
                  names = []
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      names = [node.module.split(".")[0]]
                  for n in names:
                      if n == "claimkeep":
                          continue
                      spec = importlib.util.find_spec(n)
                      origin = getattr(spec, "origin", None) or ""
                      if origin.startswith(site) or "site-packages" in origin:
                          bad.append((str(f), n, origin))
          if bad:
              print("third-party imports found:", bad)
              raise SystemExit(1)
          print("stdlib only: confirmed")
          PY

      - name: Benchmarks run from a clone
        # They shipped with absolute paths from one machine and could not start
        # anywhere else, while the changelog offered them as reproduction steps.
        # --help only proves anything for the argparse ones; stream_lme.py takes a
        # positional path and would read "--help" as a filename. For those, import
        # the module instead: that is where the sys.path resolution actually fails.
        run: |
          set -euo pipefail
          for f in benchmark/russian_recall.py benchmark/natural_experiment.py benchmark/longmemeval/*.py; do
            if grep -q argparse "$f"; then
              python "$f" --help > /dev/null || { echo "$f cannot start"; exit 1; }
            else
              python - "$f" <<'PY' || { echo "$f cannot be imported"; exit 1; }
          import importlib.util, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location(path.stem, path)
          module = importlib.util.module_from_spec(spec)
          sys.argv = [str(path)]  # the module reads argv at import time
          try:
              spec.loader.exec_module(module)
          except (SystemExit, IndexError, FileNotFoundError):
              pass  # wants arguments we are not giving it; imports resolved fine
          PY
            fi
          done
          echo "all benchmark entrypoints start"
